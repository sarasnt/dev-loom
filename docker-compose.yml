# DevLoom — self-hosted stack (SPEC.md §32).
# Core: db + backend + frontend. Optional profiles: `ai` (Ollama), `obs` (Langfuse — see note).
#
#   docker compose up -d --build            # core stack → http://localhost:8088
#   docker compose --profile ai up -d       # + local Ollama on :11434
#
# Langfuse is a multi-service stack (Postgres + ClickHouse + Redis + object store); it is
# intentionally kept in a separate file to avoid bloating the core bring-up — see
# docs/handover and DESIGN/SPEC. Wire it by setting DEVLOOM_LANGFUSE_ENABLED=true on backend.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devloom
      POSTGRES_USER: devloom
      POSTGRES_PASSWORD: devloom
    volumes:
      - devloom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devloom -d devloom"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devloom
      SPRING_DATASOURCE_USERNAME: devloom
      SPRING_DATASOURCE_PASSWORD: devloom
      DEVLOOM_CORS_ORIGINS: http://localhost:8088,http://localhost:5173,http://localhost:5174
      DEVLOOM_AI_PROVIDER: ${DEVLOOM_AI_PROVIDER:-stub}
      DEVLOOM_OLLAMA_URL: http://ollama:11434
      DEVLOOM_LANGFUSE_ENABLED: ${DEVLOOM_LANGFUSE_ENABLED:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    depends_on:
      - backend
    ports:
      - "8088:80"

  # ---- optional: local models (profile "ai") ----
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - devloom_ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  devloom_pg:
  devloom_ollama:
