# DevLoom — self-hosted stack, FROM SOURCE (SPEC.md §32). Builds backend/frontend locally
# and pulls the local models at `up`. For a portable, no-build stack that runs published
# GHCR images (with models baked in) on a fresh PC, use docker-compose.prebuilt.yml — see
# docs/DEPLOY.md.
#
# Core: db + backend + frontend. Optional profiles: `ai` (Ollama), `obs` (Langfuse).
#
#   docker compose up -d --build              # core stack → http://localhost:8088
#   docker compose --profile ai up -d         # + local Ollama on :11434 (auto-pulls models)
#   docker compose --profile obs up -d        # + Langfuse UI → http://localhost:3000
#
# The `ai` profile also runs `ollama-init`, which pulls DEVLOOM_OLLAMA_MODELS into Ollama.
# Langfuse (profile `obs`) is a self-hosted LLM-observability UI; after first login create a
# project, then set its keys + DEVLOOM_LANGFUSE_ENABLED=true on the backend to export traces.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devloom
      POSTGRES_USER: devloom
      POSTGRES_PASSWORD: devloom
    volumes:
      - devloom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devloom -d devloom"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false          # real secrets (gitignored); optional so the stack runs without it
    environment:
      # Local timezone so "now" and event times line up (override via TZ in backend/.env).
      TZ: ${TZ:-Europe/Lisbon}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devloom
      SPRING_DATASOURCE_USERNAME: devloom
      SPRING_DATASOURCE_PASSWORD: devloom
      DEVLOOM_CORS_ORIGINS: http://localhost,http://localhost:8088,http://localhost:5173,http://localhost:5174,https://mycompanion-devloom.dev,https://portal.mycompanion-devloom.dev,https://api.mycompanion-devloom.dev
      DEVLOOM_AI_PROVIDER: ${DEVLOOM_AI_PROVIDER:-stub}
      DEVLOOM_OLLAMA_URL: http://ollama:11434
      # Master secret for encrypting app-stored API keys (also settable in backend/.env).
      DEVLOOM_SECRET: ${DEVLOOM_SECRET:-}
      # DevLoom host agent (Claude subscription bridge + repos), reached on the host.
      DEVLOOM_HOST_AGENT_URL: ${DEVLOOM_HOST_AGENT_URL:-http://host.docker.internal:8765}
      # Langfuse export. HOST is infra (backend → langfuse over the compose network). The
      # enable flag + project keys come from backend/.env (paste them from your Langfuse
      # project's Setup Tracing screen). NOTE: compose `environment:` overrides `env_file`, so
      # ENABLED/keys are intentionally NOT set here — that lets backend/.env be authoritative.
      DEVLOOM_LANGFUSE_HOST: ${DEVLOOM_LANGFUSE_HOST:-http://langfuse:3000}
    # Make host.docker.internal resolve on Linux/Debian too (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Internal only — reached through the edge proxy, so a busy 8080 on your machine is
    # not a reason DevLoom cannot start. Publish it again if you want direct access.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    depends_on:
      - backend
    expose:
      - "80"

  # ---- the only container that publishes a port ----
  # Routes by hostname: portal.<domain> and the bare domain to the SPA, api.<domain> to the
  # API. Needs the names in your hosts file (see edge/nginx.conf); http://localhost keeps
  # working regardless, because the portal server is also the default_server.
  edge:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Generated by `sh edge/make-certs.sh`, gitignored. Without them nginx will not
      # start — and without TLS the .dev names cannot work at all (HSTS preload).
      - ./edge/certs:/etc/nginx/certs:ro
    ports:
      - "${DEVLOOM_HTTP_PORT:-80}:80"
      - "${DEVLOOM_HTTPS_PORT:-443}:443"
    restart: unless-stopped

  # ---- optional: local models (profile "ai") ----
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - devloom_ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Use the host NVIDIA GPU (needs Docker Desktop WSL2 GPU support / NVIDIA
    # Container Toolkit). Falls back to CPU only if you remove this block.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: pull the local models into Ollama on `up`. Idempotent (already-pulled
  # models are a no-op) and cached in the devloom_ollama volume. Override the list with
  # DEVLOOM_OLLAMA_MODELS (space-separated) in your shell or backend/.env.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ai"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      DEVLOOM_OLLAMA_MODELS: ${DEVLOOM_OLLAMA_MODELS:-qwen2.5-coder:7b gpt-oss:20b qwen3-coder:30b}
    entrypoint:
      - /bin/sh
      - -c
      - >
        echo "Provisioning Ollama models at $$OLLAMA_HOST ...";
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 2; done;
        for m in $$DEVLOOM_OLLAMA_MODELS; do echo "==> pull $$m"; ollama pull "$$m" || echo "!! pull failed: $$m"; done;
        echo "Ollama model provisioning complete.";
    restart: "no"

  # ---- optional: LLM observability — Langfuse (profile "obs") ----
  # Open at http://localhost:3000 after `docker compose --profile obs up -d`.
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["obs"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - devloom_langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["obs"]
    depends_on:
      langfuse-db:
        condition: service_healthy   # wait until Postgres accepts connections, not just started
    restart: unless-stopped          # migrations can race the DB on a cold volume; retry
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-devloom-langfuse-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-devloom-langfuse-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
      # Headless bootstrap: an org/project/user + fixed API keys on first boot, so DevLoom
      # can export with no manual setup. Log in with the email/password below to view traces.
      LANGFUSE_INIT_ORG_ID: devloom
      LANGFUSE_INIT_ORG_NAME: DevLoom
      LANGFUSE_INIT_PROJECT_ID: devloom
      LANGFUSE_INIT_PROJECT_NAME: DevLoom
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${DEVLOOM_LANGFUSE_PUBLIC_KEY:-pk-lf-devloom-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${DEVLOOM_LANGFUSE_SECRET_KEY:-sk-lf-devloom-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@devloom.local}
      LANGFUSE_INIT_USER_NAME: DevLoom Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-devloom-admin}
    ports:
      - "3000:3000"

volumes:
  devloom_pg:
  devloom_ollama:
  devloom_langfuse_pg:
