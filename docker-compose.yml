# DevLoom — self-hosted stack (SPEC.md §32).
# Core: db + backend + frontend. Optional profiles: `ai` (Ollama), `obs` (Langfuse — see note).
#
#   docker compose up -d --build              # core stack → http://localhost:8088
#   docker compose --profile ai up -d         # + local Ollama on :11434 (auto-pulls models)
#   docker compose --profile obs up -d        # + Langfuse UI → http://localhost:3000
#
# The `ai` profile also runs `ollama-init`, which pulls DEVLOOM_OLLAMA_MODELS into Ollama.
# Langfuse (profile `obs`) is a self-hosted LLM-observability UI; after first login create a
# project, then set its keys + DEVLOOM_LANGFUSE_ENABLED=true on the backend to export traces.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devloom
      POSTGRES_USER: devloom
      POSTGRES_PASSWORD: devloom
    volumes:
      - devloom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devloom -d devloom"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false          # real secrets (gitignored); optional so the stack runs without it
    environment:
      # Local timezone so "now" and event times line up (override via TZ in backend/.env).
      TZ: ${TZ:-Europe/Lisbon}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devloom
      SPRING_DATASOURCE_USERNAME: devloom
      SPRING_DATASOURCE_PASSWORD: devloom
      DEVLOOM_CORS_ORIGINS: http://localhost:8088,http://localhost:5173,http://localhost:5174
      DEVLOOM_AI_PROVIDER: ${DEVLOOM_AI_PROVIDER:-stub}
      DEVLOOM_OLLAMA_URL: http://ollama:11434
      # Master secret for encrypting app-stored API keys (also settable in backend/.env).
      DEVLOOM_SECRET: ${DEVLOOM_SECRET:-}
      # DevLoom host agent (Claude subscription bridge + repos), reached on the host.
      DEVLOOM_HOST_AGENT_URL: ${DEVLOOM_HOST_AGENT_URL:-http://host.docker.internal:8765}
      DEVLOOM_LANGFUSE_ENABLED: ${DEVLOOM_LANGFUSE_ENABLED:-false}
    # Make host.docker.internal resolve on Linux/Debian too (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    depends_on:
      - backend
    ports:
      - "8088:80"

  # ---- optional: local models (profile "ai") ----
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - devloom_ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Use the host NVIDIA GPU (needs Docker Desktop WSL2 GPU support / NVIDIA
    # Container Toolkit). Falls back to CPU only if you remove this block.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: pull the local models into Ollama on `up`. Idempotent (already-pulled
  # models are a no-op) and cached in the devloom_ollama volume. Override the list with
  # DEVLOOM_OLLAMA_MODELS (space-separated) in your shell or backend/.env.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ai"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      DEVLOOM_OLLAMA_MODELS: ${DEVLOOM_OLLAMA_MODELS:-qwen2.5-coder:7b gpt-oss:20b}
    entrypoint:
      - /bin/sh
      - -c
      - >
        echo "Provisioning Ollama models at $$OLLAMA_HOST ...";
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 2; done;
        for m in $$DEVLOOM_OLLAMA_MODELS; do echo "==> pull $$m"; ollama pull "$$m" || echo "!! pull failed: $$m"; done;
        echo "Ollama model provisioning complete.";
    restart: "no"

  # ---- optional: LLM observability — Langfuse (profile "obs") ----
  # Open at http://localhost:3000 after `docker compose --profile obs up -d`.
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["obs"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - devloom_langfuse_pg:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["obs"]
    depends_on:
      - langfuse-db
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-devloom-langfuse-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-devloom-langfuse-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

volumes:
  devloom_pg:
  devloom_ollama:
  devloom_langfuse_pg:
