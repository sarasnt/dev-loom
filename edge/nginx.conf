# The edge: the one container that publishes a port on your machine.
#
# Everything else (frontend, backend, database) is reachable only on the compose network, so a
# port already taken on the host — another Postgres on 5432, something on 8080 — is no longer a
# reason DevLoom won't start. Only this one has to be free, and it is configurable
# (DEVLOOM_HTTP_PORT in backend/.env, default 80).
#
# Requires the names to resolve to your machine. On Windows, as Administrator, add to
# C:\Windows\System32\drivers\etc\hosts:
#
#   127.0.0.1 mycompanion-devloom.dev api.mycompanion-devloom.dev portal.mycompanion-devloom.dev
#
# Nothing is registered publicly and nothing leaves the machine — .dev is a real TLD, so these
# names only mean anything because your hosts file says so.

upstream devloom_portal { server frontend:80; }
upstream devloom_api    { server backend:8080; }

# Shared proxy behaviour. Server-sent events (the build-analysis stream, model pulls) must arrive
# as they are produced, so buffering is off and the read timeout is long — a buffered SSE stream
# looks exactly like a hung request.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection '';
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;

# Nothing here proxies the terminal. Its WebSocket goes from the browser straight to the host
# agent on 127.0.0.1:8765 — a container could not reach a PTY on your machine anyway — so it
# needs the domain to resolve locally (the hosts entry above), not a route through here.

# api.<domain> — the API on its own name, for curl, scripts and eval/.
server {
    listen 80;
    server_name api.mycompanion-devloom.dev;

    # Addressed as api.<domain>/api/v1/... exactly like the portal, so one base path works from
    # either name and nothing has to know which one it came through.
    location / {
        proxy_pass http://devloom_api;
    }
}

# portal.<domain>, the bare domain, and anything else (so http://localhost keeps working without
# a hosts entry — the default_server catches names nobody configured).
server {
    listen 80 default_server;
    server_name portal.mycompanion-devloom.dev mycompanion-devloom.dev localhost _;

    location / {
        proxy_pass http://devloom_portal;
    }

    # The API through the portal's own origin, which is what the SPA calls (VITE_API_BASE=/api/v1)
    # and why it needs no CORS at all.
    location /api/ {
        proxy_pass http://devloom_api;
    }
}
