# The edge: the only container that publishes ports on your machine.
#
# Everything else (frontend, backend, database) is reachable only on the compose network, so a
# port already taken on the host — another Postgres on 5432, something on 8080 — is no longer a
# reason DevLoom won't start. Only these are published, and both are configurable
# (DEVLOOM_HTTP_PORT / DEVLOOM_HTTPS_PORT).
#
# TLS is not decoration here. `.dev` sits on the HSTS preload list compiled into every major
# browser, so a .dev name is rewritten to https:// before the request is ever sent, and an HSTS
# domain offers no way to click past an untrusted certificate. Plain HTTP on these names cannot
# be made to work. Run `sh edge/make-certs.sh` and trust the CA it writes — see the README.
#
# Requires the names to resolve to this machine (hosts file; the README has the command).

upstream devloom_portal { server frontend:80; }
upstream devloom_api    { server backend:8080; }

# Shared proxy behaviour. Server-sent events (the build-analysis stream, model pulls) must arrive
# as they are produced, so buffering is off and the read timeout is long — a buffered SSE stream
# looks exactly like a hung request.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection '';
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;

ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:4m;

# Nothing here proxies the terminal. Its WebSocket goes from the browser straight to the host
# agent on 127.0.0.1:8765 — a container could not reach a PTY on your machine anyway — so it
# needs the domain to resolve locally (the hosts entry), not a route through here.

# ---- port 80 ----------------------------------------------------------------------------------
# The .dev names never arrive here (the browser has already upgraded them), but a curl or a
# script might, so they are redirected rather than silently served.
server {
    listen 80;
    server_name mycompanion-devloom.dev *.mycompanion-devloom.dev;
    return 301 https://$host$request_uri;
}

# localhost and anything else stays on plain HTTP: it is the fallback that works before the hosts
# entry and the CA are in place, and localhost carries no HSTS.
server {
    listen 80 default_server;
    server_name localhost _;

    location /     { proxy_pass http://devloom_portal; }
    location /api/ { proxy_pass http://devloom_api; }
}

# ---- port 443 ---------------------------------------------------------------------------------
# api.<domain> — the API on its own name, for curl, scripts and eval/.
server {
    listen 443 ssl;
    http2 on;
    server_name api.mycompanion-devloom.dev;

    # Addressed as api.<domain>/api/v1/... exactly like the portal, so one base path works from
    # either name and nothing has to know which one it came through.
    location / { proxy_pass http://devloom_api; }
}

# portal.<domain>, the bare domain, and https://localhost.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name portal.mycompanion-devloom.dev mycompanion-devloom.dev localhost _;

    location / { proxy_pass http://devloom_portal; }

    # The API on the portal's own origin, which is what the SPA calls (VITE_API_BASE=/api/v1) and
    # why it needs no CORS at all.
    location /api/ { proxy_pass http://devloom_api; }
}
