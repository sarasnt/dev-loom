# DevLoom — PREBUILT stack. Runs published images from GHCR instead of building from
# source, so a fresh machine can bring the whole thing up with no build and no model
# pull. Images are published by .github/workflows/publish-images.yml.
#
#   # one-time on a new PC (public images need no login; private ones do — see DEPLOY.md)
#   docker compose -f docker-compose.prebuilt.yml pull
#   docker compose -f docker-compose.prebuilt.yml up -d          # → http://localhost:8088
#
#   # with an NVIDIA GPU (needs the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.prebuilt.yml -f docker-compose.gpu.yml up -d
#
#   # + Langfuse observability UI:
#   docker compose -f docker-compose.prebuilt.yml --profile obs up -d   # → http://localhost:3000
#
# Ollama runs CPU-only by default here so the stack starts on any machine; add the
# gpu override above to use a GPU. Override images with DEVLOOM_IMAGE_PREFIX / DEVLOOM_TAG.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devloom
      POSTGRES_USER: devloom
      POSTGRES_PASSWORD: devloom
    volumes:
      - devloom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devloom -d devloom"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    image: ${DEVLOOM_IMAGE_PREFIX:-ghcr.io/sarasnt/devloom}-backend:${DEVLOOM_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false          # real secrets (gitignored); optional so the stack runs without it
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devloom
      SPRING_DATASOURCE_USERNAME: devloom
      SPRING_DATASOURCE_PASSWORD: devloom
      DEVLOOM_CORS_ORIGINS: http://localhost:8088,http://localhost:5173,http://localhost:5174
      DEVLOOM_AI_PROVIDER: ${DEVLOOM_AI_PROVIDER:-stub}
      DEVLOOM_OLLAMA_URL: http://ollama:11434
      DEVLOOM_SECRET: ${DEVLOOM_SECRET:-}
      DEVLOOM_HOST_AGENT_URL: ${DEVLOOM_HOST_AGENT_URL:-http://host.docker.internal:8765}
      DEVLOOM_LANGFUSE_ENABLED: ${DEVLOOM_LANGFUSE_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    image: ${DEVLOOM_IMAGE_PREFIX:-ghcr.io/sarasnt/devloom}-frontend:${DEVLOOM_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "8088:80"

  # Local models — baked into the image (no pull step). CPU by default; see the gpu override.
  ollama:
    image: ${DEVLOOM_IMAGE_PREFIX:-ghcr.io/sarasnt/devloom}-ollama:${DEVLOOM_TAG:-latest}
    volumes:
      - devloom_ollama:/root/.ollama
    ports:
      - "11434:11434"

  # ---- optional: LLM observability — Langfuse (profile "obs") ----
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["obs"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - devloom_langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["obs"]
    depends_on:
      langfuse-db:
        condition: service_healthy   # wait until Postgres accepts connections, not just started
    restart: unless-stopped          # migrations can race the DB on a cold volume; retry
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-devloom-langfuse-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-devloom-langfuse-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

volumes:
  devloom_pg:
  devloom_ollama:
  devloom_langfuse_pg:
