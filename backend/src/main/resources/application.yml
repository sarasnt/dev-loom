spring:
  application:
    name: devloom-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devloom}
    username: ${SPRING_DATASOURCE_USERNAME:devloom}
    password: ${SPRING_DATASOURCE_PASSWORD:devloom}
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

devloom:
  # Comma-separated origins allowed to call the API (the Vite dev server).
  cors-allowed-origins: ${DEVLOOM_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  jira:
    # On-prem Jira Data Center. Empty PAT => connector disabled (fixtures kept).
    base-url: ${DEVLOOM_JIRA_BASE_URL:}
    pat: ${DEVLOOM_JIRA_PAT:}
    max-issues: ${DEVLOOM_JIRA_MAX:25}
    sync-on-startup: ${DEVLOOM_JIRA_SYNC_ON_STARTUP:true}
  github:
    # Empty token => connector disabled (fixture GitHub rows kept).
    base-url: ${DEVLOOM_GITHUB_BASE_URL:https://api.github.com}
    token: ${DEVLOOM_GITHUB_TOKEN:}
    max-issues: ${DEVLOOM_GITHUB_MAX:25}
  calendar:
    # Private iCal (ICS) feed URL. Empty => disabled. Outlook excluded in iteration 1.
    ics-url: ${DEVLOOM_GOOGLE_ICS_URL:}
    max-events: ${DEVLOOM_CALENDAR_MAX:15}
    horizon-days: ${DEVLOOM_CALENDAR_HORIZON:28}
  notion:
    base-url: ${DEVLOOM_NOTION_BASE_URL:https://api.notion.com}
    token: ${DEVLOOM_NOTION_TOKEN:}
    version: ${DEVLOOM_NOTION_VERSION:2022-06-28}
    max-items: ${DEVLOOM_NOTION_MAX:15}
  ai:
    # local-first: which provider the ModelRouter prefers. "stub" until Ollama is reachable.
    default-provider: ${DEVLOOM_AI_PROVIDER:stub}
    ollama-base-url: ${DEVLOOM_OLLAMA_URL:http://localhost:11434}
    default-model: ${DEVLOOM_AI_MODEL:Qwen3-Coder-30B-A3B}
    # Optional dedicated model for the brainstorm workspace (a stronger general model than
    # the coder default). Empty => use the default / first available.
    brainstorm-model: ${DEVLOOM_AI_BRAINSTORM_MODEL:}
  sync:
    interval-ms: ${DEVLOOM_SYNC_INTERVAL_MS:300000}
  langfuse:
    enabled: ${DEVLOOM_LANGFUSE_ENABLED:false}
